<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Graffiti</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d12;
      color: white;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 20px;
      max-width: 600px;
      opacity: 0.8;
      line-height: 1.5;
    }

    .app-store-button {
      margin-top: 30px;
      padding: 12px 22px;
      border-radius: 999px;
      background: white;
      color: #111;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
    }

    .app-store-button:hover {
      opacity: 0.85;
    }

    footer {
      padding: 30px 20px;
      opacity: 0.7;
    }

    footer a {
      color: white;
      margin: 0 12px;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="hero">
    <h1>Gravity Graffiti</h1>

    <p class="tagline">
      Draw the path. Drop the confetti. Master gravity.
      A physics puzzle game built around creativity, strategy,
      and the perfect drop.
    </p>

    <a
      class="app-store-button"
      href="https://apps.apple.com/us/app/gravity-graffiti-draw-drop/id6802697375"
      target="_blank"
      rel="noopener noreferrer"
    >
      Download on the App Store
    </a>
  </main>

  <footer>
    <a href="privacy.html">Privacy Policy</a>
    <a href="support.html">Support</a>

    <p>© 2026 Gravity Graffiti</p>
  </footer>

</body>
</html>
